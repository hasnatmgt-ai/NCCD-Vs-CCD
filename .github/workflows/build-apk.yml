name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Create Android project
        run: |
          P=app/src/main
          mkdir -p $P/java/com/asad/nccdccd $P/assets $P/res/values $P/res/drawable
          cp index.html $P/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "NCCDvsCCD"
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.5.2' apply false }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.asad.nccdccd'
              compileSdk 34
              defaultConfig { applicationId "com.asad.nccdccd"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:label="NCCD vs CCD" android:icon="@drawable/ic_launcher"
                android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > $P/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0B3D2E" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#F5C542" android:pathData="M54,54m-30,0a30,30 0,1 1,60 0a30,30 0,1 1,-60 0"/>
            <path android:fillColor="#0B3D2E" android:pathData="M40,70 L66,30 L72,34 L46,74 Z"/>
            <path android:fillColor="#C0392B" android:pathData="M70,68m-7,0a7,7 0,1 1,14 0a7,7 0,1 1,-14 0"/>
          </vector>
          EOF
          cat > $P/java/com/asad/nccdccd/MainActivity.java <<'EOF'
          package com.asad.nccdccd;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity {
            private WebView web;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(Color.parseColor("#0B3D2E"));
              web = new WebView(this);
              web.setBackgroundColor(Color.parseColor("#0A1F17"));
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              web.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) { return out(r.getUrl().toString()); }
                @SuppressWarnings("deprecation")
                @Override public boolean shouldOverrideUrlLoading(WebView v, String u) { return out(u); }
              });
              web.loadUrl("file:///android_asset/index.html");
              setContentView(web);
            }
            private boolean out(String u) {
              if (u.startsWith("file:")) return false;
              try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); } catch (Exception e) {}
              return true;
            }
            @Override public void onBackPressed() {
              web.evaluateJavascript("(function(){var m=document.getElementById('modal');if(m&&m.classList.contains('on')){closeModal();return 1}if(TAB!=='live'){go('live');return 1}return 0})()",
                v -> { if ("0".equals(v)) MainActivity.super.onBackPressed(); });
            }
          }
          EOF
      - run: gradle assembleDebug
      - run: mv app/build/outputs/apk/debug/app-debug.apk NCCD-vs-CCD.apk
      - uses: actions/upload-artifact@v4
        with: { name: NCCD-vs-CCD-APK, path: NCCD-vs-CCD.apk }
